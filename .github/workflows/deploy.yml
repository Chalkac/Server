name: Chalkac deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create application.properties
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.properties

      - name: Gradlew chmod
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker image build
        run: docker build -t chalkac .

      - name: Docker tag
        run: docker tag chalkac ${{ steps.login-ecr.outputs.registry }}/chalkac:latest

      - name: Docker push
        run: docker push ${{ steps.login-ecr.outputs.registry }}/chalkac:latest

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "Chalkac" \
            --version-label "v-${{ github.run_id }}" \
            --source-bundle S3Bucket=${{ secrets.EB_BUCKET_NAME }},S3Key=${{ steps.login-ecr.outputs.registry }}/chalkac:latest

          aws elasticbeanstalk update-environment \
            --environment-name "Chalkac-env" \
            --version-label "v-${{ github.run_id }}"
